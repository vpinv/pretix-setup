services:
  # --- Pretix Core Application ---
  pretix:
    image: pretix/standalone:stable
    platform: linux/amd64       # Forces emulation layer on ARM64 chips
    container_name: pretix_app
    restart: always
    ports:
      - "8345:80"               # Maps public droplet port 8345 to internal port 80
    environment:
      # General Settings
      - PRETIX_INSTANCE_NAME=My Ticket Shop
      - PRETIX_URL=http://168.144.69.28.sslip.io:8345
      - PRETIX_ALLOWED_HOSTS=168.144.69.28.sslip.io,localhost,127.0.0.1
      - PRETIX_ALLOW_OTHER_HOSTS=True
      - PRETIX_CURRENCY=EUR
      
      # Database Connection
      - PRETIX_DATABASE_BACKEND=postgresql_psycopg2
      - PRETIX_DATABASE_NAME=pretix
      - PRETIX_DATABASE_USER=pretix
      - PRETIX_DATABASE_PASSWORD=YOUR_STRONG_DB_PASSWORD
      - PRETIX_DATABASE_HOST=pretix_db
      
      # Redis Cache & Celery Backend
      - PRETIX_REDIS_LOCATION=redis://pretix_redis:6379/1
      - PRETIX_REDIS_SESSIONS=True
      
      # Mail Configuration
      - PRETIX_MAIL_FROM=tickets@yourdomain.com
      - PRETIX_MAIL_HOST=smtp.yourdomain.com
      - PRETIX_MAIL_PORT=587
      - PRETIX_MAIL_USER=smtp_username
      - PRETIX_MAIL_PASSWORD=YOUR_SMTP_PASSWORD
      - PRETIX_MAIL_TLS=True
    volumes:
      - pretix_app_data:/data   
    depends_on:
      pretix_db:
        condition: service_healthy
      pretix_redis:
        condition: service_started

  # --- Database ---
  pretix_db:
    image: postgres:16-alpine
    container_name: pretix_db
    restart: always
    environment:
      - POSTGRES_DB=pretix
      - POSTGRES_USER=pretix
      - POSTGRES_PASSWORD=YOUR_STRONG_DB_PASSWORD
    volumes:
      - pretix_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pretix"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Cache & Task Queue Broker ---
  pretix_redis:
    image: redis:7-alpine
    container_name: pretix_redis
    restart: always
    volumes:
      - pretix_redis_data:/data

volumes:
  pretix_app_data:
  pretix_db_data:
  pretix_redis_data:
